server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path that isn't a real
    # file must fall back to index.html, or refreshing on e.g. /donor 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets Vite outputs; never cache index.html
    # itself, so deploys are picked up immediately on next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
